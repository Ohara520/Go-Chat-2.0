<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Simon 自主日程 V1 · 本地测试</title>
<style>
  body { font-family: monospace; background:#1e1e1e; color:#d4d4d4; padding:20px; }
  .pass { color:#4ec9b0; } .fail { color:#f48771; } .skip { color:#ce9178; }
  .section { border:1px solid #444; padding:12px; margin:16px 0; border-radius:4px; }
  pre { background:#252526; padding:8px; border-radius:4px; white-space:pre-wrap; font-size:12px; }
  button { background:#0e639c; color:#fff; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; margin:4px; }
  h2 { color:#9cdcfe; }
</style>
</head>
<body>
<h1>Simon 自主日程 V1 · 本地单元测试</h1>
<p style="color:#ce9178">⚠️ 纯本地测试，不连接 Supabase。Haiku 相关测试标注为「待集成验证」。</p>
<button onclick="runAll()">▶ 运行全部测试</button>
<div id="output"></div>

<script>
// ===== Mock 依赖 =====
window.getSbUserId        = () => 'user_test_001';
window.getCurrentCharacter = () => 'ghost';
window.getGhostDateStr    = () => FAKE_TODAY;
window.getGhostWeekday    = () => 'Tuesday';
window.getGhostTimeStr    = () => '09:30';
window.getActiveContinuity = () => [];
window.getGhostTimeZone   = () => 'Europe/London';
window.fetchDeepSeek      = async () => null; // mock：不调用真实 Haiku
window.scheduleCloudSave  = () => {};
window.cancelContinuity   = () => {};
window.getSchedulesForSnapshot  = () => ({});
window.restoreSchedulesFromSnapshot = () => {};

const FAKE_TODAY = '2026-11-04';
const FAKE_USER  = 'user_test_001';
const FAKE_CHAR  = 'ghost';

// 统计
let passed = 0, failed = 0, skipped = 0;

function log(msg, type = 'info') {
  const el = document.getElementById('output');
  const cls = type === 'pass' ? 'pass' : type === 'fail' ? 'fail' : type === 'skip' ? 'skip' : '';
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
}

function assert(cond, msg) {
  if (cond) { log(`  ✓ ${msg}`, 'pass'); passed++; }
  else       { log(`  ✗ ${msg}`, 'fail'); failed++; }
}

function skip(msg) {
  log(`  ⊘ [待集成验证] ${msg}`, 'skip'); skipped++;
}

// 清理测试用的 localStorage
function clearTestKeys() {
  Object.keys(localStorage).filter(k => k.startsWith('simonSchedule_user_test')).forEach(k => localStorage.removeItem(k));
}

// 注入 dailySchedule.js 的函数（直接引用，因为同页运行）
// 这里内联一个精简版供测试
function makeScheduleKey(userId, charId, date) {
  return `simonSchedule_${userId}_${charId}_${date}`;
}

function makeTestSchedule(overrides) {
  return Object.assign({
    meta: { userId: FAKE_USER, charId: FAKE_CHAR, date: FAKE_TODAY, generatedAt: Date.now(), cloudLoaded: true },
    plan: [
      { id: 'sched_001', activity: 'Morning run', startTime: '06:30', endTime: '07:15', location: 'Base perimeter', status: 'planned', createdAt: Date.now() },
      { id: 'sched_002', activity: 'Briefing', startTime: '09:00', endTime: '10:00', location: 'HQ', status: 'planned', createdAt: Date.now() },
    ],
    changes: []
  }, overrides);
}

// ===== 测试函数 =====
async function runAll() {
  document.getElementById('output').innerHTML = '';
  passed = 0; failed = 0; skipped = 0;
  clearTestKeys();

  await t1_keyIsolation();
  await t2_skipIfExists();
  await t3_waitForCloud();
  await t4_applyChange_cancel();
  await t5_applyChange_postpone();
  await t6_applyChange_idempotent();
  await t7_buildContextBlock();
  await t8_cloudMerge_newFromCloud();
  await t9_cloudMerge_localNewer();
  await t10_cloudMerge_changes_union();
  await t11_cleanOldSchedules();
  await t12_extractorNoSignal();
  await t13_extractorNoPlanned();
  await t14_invalidTime_filtered();
  await t16_cloudFailSafe();
  await t17_mergeChanges_bothSides();
  await t18_saveTriggersCloud();
  await t15_haikuGeneration_skip();

  log('');
  log(`━━━ 结果：${passed} passed / ${failed} failed / ${skipped} skipped ━━━`,
      failed > 0 ? 'fail' : 'pass');
}

// ── 测试 1: key 按 userId+charId+date 隔离 ──
async function t1_keyIsolation() {
  log('\n[T1] key 隔离：userId + charId + date');
  const k1 = makeScheduleKey('user_a', 'ghost', '2026-11-04');
  const k2 = makeScheduleKey('user_b', 'ghost', '2026-11-04');
  const k3 = makeScheduleKey('user_a', 'keegan', '2026-11-04');
  const k4 = makeScheduleKey('user_a', 'ghost', '2026-11-05');
  const keys = [k1, k2, k3, k4];
  assert(new Set(keys).size === 4, '4 种组合产生 4 个不同 key');
  assert(k1.includes('user_a') && k1.includes('ghost'), 'key 含 userId 和 charId');
}

// ── 测试 2: 同天已有日程不重新生成 ──
async function t2_skipIfExists() {
  log('\n[T2] 同天已有日程不重新生成');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const sched = makeTestSchedule();
  localStorage.setItem(key, JSON.stringify(sched));

  // 模拟 checkAndGenerateSchedule 的前置检查
  const existing = JSON.parse(localStorage.getItem(key));
  assert(existing !== null, '日程存在');
  assert(existing.meta.cloudLoaded === true, 'cloudLoaded=true，不需重新生成');
  // 若 cloudLoaded=true 且存在，逻辑应直接 return
  clearTestKeys();
}

// ── 测试 3: 云端未加载时不生成新日程 ──
async function t3_waitForCloud() {
  log('\n[T3] 云端未加载时不生成日程');
  clearTestKeys();
  // cloudLoadDone=false 时，无日程的情况下不生成
  let generationCalled = false;
  const origFetch = window.fetchDeepSeek;
  window.fetchDeepSeek = async () => { generationCalled = true; return null; };

  // 模拟：无日程 + cloudLoadDone=false → 不调用生成
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const existing = localStorage.getItem(key);
  if (!existing && false /* cloudLoadDone=false */) {
    // 不应走到这里
    generationCalled = true;
  }
  assert(!generationCalled, 'cloudLoadDone=false 时不触发 Haiku 调用');
  window.fetchDeepSeek = origFetch;
  clearTestKeys();
}

// ── 测试 4: 取消变更正确应用 ──
async function t4_applyChange_cancel() {
  log('\n[T4] 取消变更正确应用');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const sched = makeTestSchedule();
  localStorage.setItem(key, JSON.stringify(sched));

  // 直接调用 applyScheduleChange 逻辑（内联测试）
  const loaded = JSON.parse(localStorage.getItem(key));
  const change = { itemId: 'sched_001', type: 'cancel', evidence: 'Run got cancelled', recordedAt: Date.now() };

  // 手动执行变更逻辑
  loaded.changes.push(change);
  const item = loaded.plan.find(p => p.id === 'sched_001');
  item.status = 'cancelled';
  localStorage.setItem(key, JSON.stringify(loaded));

  const updated = JSON.parse(localStorage.getItem(key));
  assert(updated.plan.find(p => p.id === 'sched_001').status === 'cancelled', 'item status = cancelled');
  assert(updated.changes.length === 1, 'changes 记录了 1 条变更');
  assert(updated.changes[0].type === 'cancel', 'change.type = cancel');
  clearTestKeys();
}

// ── 测试 5: 推迟变更更新时间 ──
async function t5_applyChange_postpone() {
  log('\n[T5] 推迟变更更新时间');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const sched = makeTestSchedule();
  localStorage.setItem(key, JSON.stringify(sched));

  const loaded = JSON.parse(localStorage.getItem(key));
  const change = { itemId: 'sched_002', type: 'postpone', newTime: '11:00', evidence: 'Pushed to 11', recordedAt: Date.now() };
  loaded.changes.push(change);
  const item = loaded.plan.find(p => p.id === 'sched_002');
  item.status = 'postponed';
  item.startTime = '11:00';
  localStorage.setItem(key, JSON.stringify(loaded));

  const updated = JSON.parse(localStorage.getItem(key));
  assert(updated.plan.find(p => p.id === 'sched_002').status === 'postponed', 'status = postponed');
  assert(updated.plan.find(p => p.id === 'sched_002').startTime === '11:00', 'startTime 更新为 11:00');
  clearTestKeys();
}

// ── 测试 6: 变更幂等（同 itemId+type 不重复记录）──
async function t6_applyChange_idempotent() {
  log('\n[T6] 变更幂等性');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const sched = makeTestSchedule();
  sched.changes.push({ itemId: 'sched_001', type: 'cancel', evidence: 'First', recordedAt: Date.now() });
  localStorage.setItem(key, JSON.stringify(sched));

  // 尝试再次添加相同变更
  const loaded = JSON.parse(localStorage.getItem(key));
  const alreadyRecorded = loaded.changes.some(c => c.itemId === 'sched_001' && c.type === 'cancel');
  assert(alreadyRecorded, '检测到已有相同变更');
  if (!alreadyRecorded) loaded.changes.push({ itemId: 'sched_001', type: 'cancel', evidence: 'Duplicate', recordedAt: Date.now() });
  assert(loaded.changes.filter(c => c.itemId === 'sched_001' && c.type === 'cancel').length === 1, '不重复插入');
  clearTestKeys();
}

// ── 测试 7: buildScheduleContextBlock 格式正确 ──
async function t7_buildContextBlock() {
  log('\n[T7] buildScheduleContextBlock 格式验证');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const sched = makeTestSchedule();
  sched.changes.push({ itemId: 'sched_001', type: 'cancel', evidence: 'cancelled', recordedAt: Date.now() });
  localStorage.setItem(key, JSON.stringify(sched));

  // 内联 buildScheduleContextBlock 逻辑
  const loaded = JSON.parse(localStorage.getItem(key));
  const changeMap = {};
  (loaded.changes || []).forEach(c => { changeMap[c.itemId] = c.type; });

  const lines = [`[TODAY'S SCHEDULE — ${FAKE_TODAY}]`];
  loaded.plan.forEach(item => {
    const effectiveStatus = changeMap[item.id] === 'cancel' ? 'cancelled' : item.status;
    const flag = effectiveStatus === 'cancelled' ? ' [cancelled]' : '';
    lines.push(`${item.startTime}  ${item.activity}${flag}`);
  });

  const block = lines.join('\n');
  assert(block.includes("[TODAY'S SCHEDULE"), '包含标题');
  assert(block.includes('06:30  Morning run [cancelled]'), '取消项显示 [cancelled]');
  assert(block.includes('09:00  Briefing'), '未取消项正常显示');
  assert(!block.includes('undefined'), '无 undefined 字段');
  clearTestKeys();
}

// ── 测试 8: 云端恢复 — 本地无，用云端 ──
async function t8_cloudMerge_newFromCloud() {
  log('\n[T8] 云端恢复：本地无日程，用云端版本');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  assert(!localStorage.getItem(key), '本地无日程');

  const cloudSched = makeTestSchedule({ meta: { userId: FAKE_USER, charId: FAKE_CHAR, date: FAKE_TODAY, generatedAt: 1000, cloudLoaded: false }});
  // 模拟恢复逻辑
  const existing = localStorage.getItem(key);
  if (!existing) {
    localStorage.setItem(key, JSON.stringify(cloudSched));
  }
  const saved = JSON.parse(localStorage.getItem(key));
  assert(saved !== null, '日程已恢复');
  assert(saved.plan.length === 2, '计划条目正确');
  clearTestKeys();
}

// ── 测试 9: 云端恢复 — 本地更新，保留本地 ──
async function t9_cloudMerge_localNewer() {
  log('\n[T9] 云端恢复：本地 generatedAt 更新，保留本地');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const localSched = makeTestSchedule({ meta: { userId: FAKE_USER, charId: FAKE_CHAR, date: FAKE_TODAY, generatedAt: 2000, cloudLoaded: true }});
  localStorage.setItem(key, JSON.stringify(localSched));

  const cloudSched = makeTestSchedule({ meta: { userId: FAKE_USER, charId: FAKE_CHAR, date: FAKE_TODAY, generatedAt: 1000, cloudLoaded: false }});

  // 模拟合并逻辑
  const local = JSON.parse(localStorage.getItem(key));
  if (cloudSched.meta.generatedAt > (local.meta.generatedAt || 0)) {
    // 云端更新，用云端
    localStorage.setItem(key, JSON.stringify(cloudSched));
  } else {
    // 本地更新，标记 cloudLoaded
    local.meta.cloudLoaded = true;
    localStorage.setItem(key, JSON.stringify(local));
  }

  const result = JSON.parse(localStorage.getItem(key));
  assert(result.meta.generatedAt === 2000, '保留本地更新版本（generatedAt=2000）');
  assert(result.meta.cloudLoaded === true, 'cloudLoaded 已标记');
  clearTestKeys();
}

// ── 测试 10: 云端恢复 — changes 取并集 ──
async function t10_cloudMerge_changes_union() {
  log('\n[T10] 云端恢复：changes 取并集，不丢失变更');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);

  const localSched = makeTestSchedule();
  localSched.changes = [{ itemId: 'sched_001', type: 'cancel', evidence: 'local', recordedAt: 100 }];
  localStorage.setItem(key, JSON.stringify(localSched));

  const cloudSched = makeTestSchedule({ meta: { userId: FAKE_USER, charId: FAKE_CHAR, date: FAKE_TODAY, generatedAt: localSched.meta.generatedAt + 1, cloudLoaded: false }});
  cloudSched.changes = [{ itemId: 'sched_002', type: 'postpone', evidence: 'cloud', recordedAt: 200 }];

  // 模拟 _mergeChanges
  function mergeChanges(a, b) {
    const seen = new Set();
    return [...a, ...b].filter(c => {
      const k = `${c.itemId}_${c.type}`;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
  }

  const local = JSON.parse(localStorage.getItem(key));
  // 云端 generatedAt 更新，用云端 plan，但 changes 取并集
  const mergedChanges = mergeChanges(cloudSched.changes, local.changes);
  const merged = { ...cloudSched, changes: mergedChanges };
  localStorage.setItem(key, JSON.stringify(merged));

  const result = JSON.parse(localStorage.getItem(key));
  assert(result.changes.length === 2, 'changes 取并集，包含 2 条变更');
  assert(result.changes.some(c => c.type === 'cancel'), '本地 cancel 变更保留');
  assert(result.changes.some(c => c.type === 'postpone'), '云端 postpone 变更保留');
  clearTestKeys();
}

// ── 测试 11: 清理 7 天前旧日程 ──
async function t11_cleanOldSchedules() {
  log('\n[T11] 清理 7 天前旧日程');
  clearTestKeys();
  const oldDate = '2026-10-01';
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, oldDate);
  const oldSched = makeTestSchedule({ meta: { userId: FAKE_USER, charId: FAKE_CHAR, date: oldDate, generatedAt: Date.now() - 8 * 24 * 60 * 60 * 1000, cloudLoaded: true }});
  localStorage.setItem(key, JSON.stringify(oldSched));

  // 模拟清理逻辑
  const prefix = `simonSchedule_${FAKE_USER}_${FAKE_CHAR}_`;
  const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
  Object.keys(localStorage).forEach(k => {
    if (!k.startsWith(prefix)) return;
    try {
      const obj = JSON.parse(localStorage.getItem(k));
      if (obj?.meta?.generatedAt && obj.meta.generatedAt < cutoff) localStorage.removeItem(k);
    } catch(e) {}
  });

  assert(!localStorage.getItem(key), '8 天前的日程已被清理');
  clearTestKeys();
}

// ── 测试 12: 提取器 — 无变更信号不触发 ──
async function t12_extractorNoSignal() {
  log('\n[T12] 提取器：无变更信号不触发 Haiku');
  const signals = [
    /\b(cancel(led)?|call(ed)?\s+off)\b/i,
    /\b(push(ed)?\s+(back|to)|postpone[d]?)\b/i,
    /\b(just\s+(finished|wrapped|done|back)\b)\b/i,
    /\b(heading\s+(in|out)|on\s+my\s+way)\b/i,
  ];
  const noSignalTexts = [
    "Yeah, I'm fine. How are you?",
    "Miss you.",
    "The weather is shit here.",
    "Had coffee this morning.",
  ];
  const hasSignal = (text) => signals.some(re => re.test(text));
  noSignalTexts.forEach(t => {
    assert(!hasSignal(t), `无信号: "${t.slice(0, 40)}"`);
  });
}

// ── 测试 13: 提取器 — 当天无计划不触发 ──
async function t13_extractorNoPlanned() {
  log('\n[T13] 提取器：当天无 planned 事项不触发');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const sched = makeTestSchedule();
  // 全部标为 cancelled
  sched.plan.forEach(p => { p.status = 'cancelled'; });
  localStorage.setItem(key, JSON.stringify(sched));

  const loaded = JSON.parse(localStorage.getItem(key));
  const planned = loaded.plan.filter(p => p.status === 'planned');
  assert(planned.length === 0, '无 planned 事项，提取器应跳过');
  clearTestKeys();
}

// ── 测试 14: 生成校验 — 无效时间被过滤 ──
async function t14_invalidTime_filtered() {
  log('\n[T14] 生成校验：无效 startTime 被过滤');
  function validateTime(t) { return t && typeof t === 'string' && /^\d{2}:\d{2}$/.test(t); }
  const mockItems = [
    { activity: 'Run', startTime: '06:30', endTime: '07:00', location: null },
    { activity: 'Bad time', startTime: 'sometime', endTime: null, location: null },
    { activity: 'No time', startTime: null, endTime: null, location: null },
    { activity: 'Valid', startTime: '14:00', endTime: '15:00', location: 'HQ' },
  ];
  const filtered = mockItems.filter(it => it && typeof it.activity === 'string');
  // startTime 可以为 null，但 activity 必须存在
  const valid = filtered.map(it => ({
    ...it,
    startTime: validateTime(it.startTime) ? it.startTime : null,
    endTime:   validateTime(it.endTime)   ? it.endTime   : null,
  }));
  assert(valid.length === 4, '4 条有 activity 的项通过过滤');
  assert(valid.find(it => it.activity === 'Run').startTime === '06:30', '有效时间保留');
  assert(valid.find(it => it.activity === 'Bad time').startTime === null, '无效时间置 null');
  assert(valid.find(it => it.activity === 'No time').startTime === null, 'null 时间保留 null');
}

// ── 测试 16: 云端失败时 cloudLoadDone=false 不生成（安全防护）──
async function t16_cloudFailSafe() {
  log('\n[T16] 云端失败时不生成（安全防护）');
  clearTestKeys();
  let generationCalled = false;
  const origFetch = window.fetchDeepSeek;
  window.fetchDeepSeek = async () => { generationCalled = true; return null; };

  // 模拟 checkAndGenerateSchedule 的核心判断
  const cloudLoadDone = false;  // 云端加载失败
  const existing = loadTodaySchedule_test();

  // 逻辑：无日程 + cloudLoadDone=false → 不生成
  if (!existing && !cloudLoadDone) {
    // 正确路径：跳过生成
  } else if (!existing && cloudLoadDone) {
    generationCalled = true;
  }

  assert(!generationCalled, '云端失败时不触发 Haiku 生成，防止覆盖云端数据');
  window.fetchDeepSeek = origFetch;
  clearTestKeys();
}

// ── 测试 17: 本地 generatedAt 更新时也合并云端 changes ──
async function t17_mergeChanges_bothSides() {
  log('\n[T17] 多设备合并：本地更新时云端 changes 不丢失');
  clearTestKeys();
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);

  // 本地有更新的 generatedAt
  const localSched = makeTestSchedule({ meta: { userId: FAKE_USER, charId: FAKE_CHAR, date: FAKE_TODAY, generatedAt: 3000, cloudLoaded: false }});
  localSched.changes = [{ itemId: 'sched_001', type: 'cancel', evidence: 'local cancel', recordedAt: 100 }];
  localStorage.setItem(key, JSON.stringify(localSched));

  // 云端有不同的 changes
  const cloudSched = makeTestSchedule({ meta: { userId: FAKE_USER, charId: FAKE_CHAR, date: FAKE_TODAY, generatedAt: 1000, cloudLoaded: false }});
  cloudSched.changes = [{ itemId: 'sched_002', type: 'postpone', evidence: 'cloud postpone', recordedAt: 200 }];

  // 执行修复后的合并逻辑
  function mergeChanges(a, b) {
    const seen = new Set();
    return [...a, ...b].filter(c => { const k = `${c.itemId}_${c.type}`; if (seen.has(k)) return false; seen.add(k); return true; });
  }

  const local = JSON.parse(localStorage.getItem(key));
  const mergedChanges = mergeChanges(cloudSched.changes, local.changes);

  if (!local.meta || cloudSched.meta.generatedAt > (local.meta.generatedAt || 0)) {
    const merged = { ...cloudSched, changes: mergedChanges };
    merged.meta.cloudLoaded = true;
    localStorage.setItem(key, JSON.stringify(merged));
  } else {
    // 本地 generatedAt 更新 → 保留本地 plan，但合并 changes
    local.changes = mergedChanges;
    local.meta.cloudLoaded = true;
    localStorage.setItem(key, JSON.stringify(local));
  }

  const result = JSON.parse(localStorage.getItem(key));
  assert(result.meta.generatedAt === 3000, '保留本地较新的 generatedAt（plan）');
  assert(result.changes.length === 2, '两侧 changes 都保留（2 条）');
  assert(result.changes.some(c => c.type === 'cancel'), '本地 cancel 变更保留');
  assert(result.changes.some(c => c.type === 'postpone'), '云端 postpone 变更保留');
  clearTestKeys();
}

// ── 测试 18: _saveSchedule 触发 scheduleCloudSave ──
async function t18_saveTriggersCloud() {
  log('\n[T18] _saveSchedule 调用 scheduleCloudSave');
  let cloudSaveCalled = false;
  const origScheduleCloudSave = window.scheduleCloudSave;
  window.scheduleCloudSave = () => { cloudSaveCalled = true; };

  // 直接测试 _saveSchedule 行为：写 localStorage 后调用 scheduleCloudSave
  const key = makeScheduleKey(FAKE_USER, FAKE_CHAR, FAKE_TODAY);
  const sched = makeTestSchedule();
  localStorage.setItem(key, JSON.stringify(sched));
  // 模拟 _saveSchedule 新逻辑
  if (typeof scheduleCloudSave === 'function') scheduleCloudSave();

  assert(cloudSaveCalled, '_saveSchedule 触发了 scheduleCloudSave');
  window.scheduleCloudSave = origScheduleCloudSave;
